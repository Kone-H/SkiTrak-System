<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e07b00"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d7a46"/>
    </marker>
    <style>
      .t  { font-size: 17px; font-weight: bold; fill: #111; }
      .s  { font-size: 14px; fill: #333; }
      .lab{ font-size: 13px; fill: #333; }
      .cap{ font-size: 18px; font-weight: bold; fill: #444; }
      .halo{ paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .client { fill: #dbe8fb; stroke: #1f5fbf; stroke-width: 2; }
      .server { fill: #d9f2e2; stroke: #1d7a46; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="800" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">SkiTrak Load Client — Threading Model (client-part1 and client-part2)</text>

  <!-- containers -->
  <rect x="20" y="60" width="1150" height="890" rx="14" fill="#fafafa" stroke="#888" stroke-dasharray="8 6"/>
  <text x="40" y="88" class="cap">Client — LoadClientMsg</text>
  <rect x="1210" y="60" width="370" height="890" rx="14" fill="#f3faf5" stroke="#1d7a46" stroke-dasharray="8 6"/>
  <text x="1230" y="88" class="cap" fill="#1d7a46">EC2 (us-west-2) · Tomcat 9</text>

  <!-- main thread -->
  <rect x="40" y="102" width="1110" height="90" rx="10" fill="#fff4cc" stroke="#b38600" stroke-width="2"/>
  <text x="60" y="128" class="t">main thread — LoadClientMsg.main()</text>
  <text x="60" y="153" class="s">connect 10 subscribers  →  start warmup, await CountDownLatch(32)  →  start main phase, await CountDownLatch(45)</text>
  <text x="60" y="176" class="s">→  close subscribers  →  SummaryPrinter prints the reports  →  CsvWriter writes the CSV files (client-part2)</text>

  <!-- ingest row -->
  <rect x="40" y="235" width="200" height="110" rx="10" class="client"/>
  <text x="140" y="268" text-anchor="middle" class="t">SwipeGenerator</text>
  <text x="140" y="294" text-anchor="middle" class="s">1 producer thread</text>
  <text x="140" y="316" text-anchor="middle" class="s">creates 500,000</text>
  <text x="140" y="336" text-anchor="middle" class="s">SwipeEvents</text>

  <line x1="242" y1="290" x2="292" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="267" y="280" text-anchor="middle" class="lab">put()</text>

  <rect x="295" y="235" width="215" height="110" rx="10" class="client"/>
  <text x="402" y="268" text-anchor="middle" class="t">BlockingQueue</text>
  <text x="402" y="294" text-anchor="middle" class="s">LinkedBlockingQueue</text>
  <text x="402" y="316" text-anchor="middle" class="s">&lt;SwipeEvent&gt;</text>
  <text x="402" y="336" text-anchor="middle" class="s">capacity 10,000</text>

  <!-- queue -> warmup first, then main -->
  <line x1="512" y1="262" x2="562" y2="249" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="537" y="242" text-anchor="middle" class="lab">take()</text>
  <path d="M512 318 L538 318 L538 374 L562 374" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="537" y="396" text-anchor="middle" class="lab">take()</text>

  <rect x="565" y="205" width="280" height="88" rx="10" class="client"/>
  <text x="705" y="234" text-anchor="middle" class="t">Warmup pool</text>
  <text x="705" y="259" text-anchor="middle" class="s">32 threads × 1,000 swipes,</text>
  <text x="705" y="279" text-anchor="middle" class="s">each thread then terminates</text>

  <line x1="705" y1="295" x2="705" y2="327" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="715" y="316" class="lab halo">then, after all 32 finish</text>

  <rect x="565" y="330" width="280" height="88" rx="10" class="client"/>
  <text x="705" y="359" text-anchor="middle" class="t">Main-phase pool</text>
  <text x="705" y="384" text-anchor="middle" class="s">N threads (final run: 45) claim</text>
  <text x="705" y="404" text-anchor="middle" class="s">from AtomicInteger remaining</text>

  <line x1="847" y1="249" x2="897" y2="275" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M847 374 L872 374 L872 318 L897 318" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="872" y="300" text-anchor="middle" class="lab halo">send()</text>

  <rect x="900" y="225" width="250" height="135" rx="10" class="client"/>
  <text x="1025" y="256" text-anchor="middle" class="t">SwipeSender</text>
  <text x="1025" y="282" text-anchor="middle" class="s">1 HttpClient, keep-alive pool</text>
  <text x="1025" y="304" text-anchor="middle" class="s">retry ≤ 5, exponential backoff</text>
  <text x="1025" y="326" text-anchor="middle" class="s">AtomicInteger success / failure</text>
  <text x="1025" y="348" text-anchor="middle" class="s">times each request (nanoTime)</text>

  <!-- HTTP to server -->
  <line x1="1152" y1="270" x2="1262" y2="270" stroke="#1d7a46" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="1207" y="258" text-anchor="middle" class="lab halo" fill="#1d7a46">HTTP POST</text>
  <line x1="1262" y1="318" x2="1152" y2="318" stroke="#e07b00" stroke-width="3" marker-end="url(#arrOrange)"/>

  <rect x="1265" y="225" width="295" height="135" rx="10" class="server"/>
  <text x="1412" y="258" text-anchor="middle" class="t">SkierServlet</text>
  <text x="1412" y="284" text-anchor="middle" class="s">POST /skiers/{resort}/seasons/</text>
  <text x="1412" y="304" text-anchor="middle" class="s">{season}/days/{day}/skiers/{skier}</text>
  <text x="1412" y="326" text-anchor="middle" class="s">validate → 201 (no aggregation)</text>
  <text x="1412" y="346" text-anchor="middle" class="s">Tomcat worker threads</text>

  <rect x="1265" y="440" width="295" height="110" rx="10" class="server"/>
  <text x="1412" y="472" text-anchor="middle" class="t">HealthServlet</text>
  <text x="1412" y="498" text-anchor="middle" class="s">GET /health</text>
  <text x="1412" y="520" text-anchor="middle" class="s">→ 200 {"status":"Active"}</text>
  <text x="1412" y="540" text-anchor="middle" class="s">health check (load balancer in A2)</text>

  <!-- part2 row -->
  <rect x="280" y="455" width="880" height="140" rx="12" fill="none" stroke="#7a4fbf" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="295" y="477" class="lab" fill="#7a4fbf" font-weight="bold">client-part2 only (per-swipe metrics, single writer)</text>

  <line x1="1025" y1="362" x2="1025" y2="487" stroke="#e07b00" stroke-width="3" marker-end="url(#arrOrange)"/>
  <text x="1035" y="430" class="lab" fill="#e07b00" font-weight="bold">add SwipeRecord</text>

  <rect x="900" y="490" width="250" height="90" rx="10" class="client"/>
  <text x="1025" y="520" text-anchor="middle" class="t">records</text>
  <text x="1025" y="545" text-anchor="middle" class="s">ConcurrentLinkedQueue</text>
  <text x="1025" y="565" text-anchor="middle" class="s">&lt;SwipeRecord&gt;, 500,000 rows</text>

  <line x1="898" y1="535" x2="848" y2="535" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="873" y="525" text-anchor="middle" class="lab">after</text>
  <text x="873" y="555" text-anchor="middle" class="lab">join</text>

  <rect x="565" y="490" width="280" height="90" rx="10" class="client"/>
  <text x="705" y="520" text-anchor="middle" class="t">CsvWriter</text>
  <text x="705" y="545" text-anchor="middle" class="s">runs on main thread only</text>
  <text x="705" y="565" text-anchor="middle" class="s">(single writer, no contention)</text>

  <line x1="563" y1="535" x2="513" y2="535" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="295" y="490" width="215" height="90" rx="10" class="client"/>
  <text x="402" y="520" text-anchor="middle" class="t">results/</text>
  <text x="402" y="545" text-anchor="middle" class="s">swipes_N.csv</text>
  <text x="402" y="565" text-anchor="middle" class="s">throughput_N.csv</text>

  <!-- websocket row -->
  <rect x="1265" y="660" width="295" height="130" rx="10" class="server"/>
  <text x="1412" y="692" text-anchor="middle" class="t">LeaderboardEndpoint</text>
  <text x="1412" y="718" text-anchor="middle" class="s">/leaderboard/{resortID}</text>
  <text x="1412" y="740" text-anchor="middle" class="s">1 pusher thread (scheduled)</text>
  <text x="1412" y="762" text-anchor="middle" class="s">synthetic top-N every 500 ms</text>
  <text x="1412" y="782" text-anchor="middle" class="s">+ serverTimestamp</text>

  <line x1="1152" y1="705" x2="1262" y2="705" stroke="#1d7a46" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="1207" y="693" text-anchor="middle" class="lab halo" fill="#1d7a46">connect</text>
  <line x1="1262" y1="752" x2="1152" y2="752" stroke="#1d7a46" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="1207" y="772" text-anchor="middle" class="lab halo" fill="#1d7a46">WS push</text>

  <rect x="845" y="650" width="305" height="150" rx="10" class="client"/>
  <text x="997" y="680" text-anchor="middle" class="t">10 × LeaderboardSubscriber</text>
  <text x="997" y="706" text-anchor="middle" class="s">one persistent connection per resort</text>
  <text x="997" y="728" text-anchor="middle" class="s">@OnMessage on Tyrus callback threads</text>
  <text x="997" y="750" text-anchor="middle" class="s">@OnClose → reconnect thread</text>
  <text x="997" y="772" text-anchor="middle" class="s">(only while ingest is running)</text>
  <text x="997" y="792" text-anchor="middle" class="s">@OnError → log only</text>

  <line x1="843" y1="725" x2="733" y2="725" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="788" y="713" text-anchor="middle" class="lab">record</text>

  <rect x="400" y="655" width="330" height="140" rx="10" class="client"/>
  <text x="565" y="686" text-anchor="middle" class="t">Subscribe-path state</text>
  <text x="565" y="714" text-anchor="middle" class="s">updatesPerResort[10]: AtomicInteger</text>
  <text x="565" y="736" text-anchor="middle" class="s">pushLatencies: ConcurrentLinkedQueue</text>
  <text x="565" y="758" text-anchor="middle" class="s">(receive time − serverTimestamp)</text>
  <text x="565" y="780" text-anchor="middle" class="s">reconnections: AtomicInteger</text>

  <line x1="398" y1="725" x2="243" y2="725" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="320" y="713" text-anchor="middle" class="lab">snapshot</text>

  <rect x="40" y="680" width="200" height="90" rx="10" class="client"/>
  <text x="140" y="710" text-anchor="middle" class="t">SummaryPrinter</text>
  <text x="140" y="735" text-anchor="middle" class="s">main thread prints</text>
  <text x="140" y="755" text-anchor="middle" class="s">all reports</text>

  <!-- legend -->
  <rect x="40" y="840" width="1110" height="102" rx="10" fill="#ffffff" stroke="#bbb"/>
  <rect x="60" y="860" width="26" height="18" rx="4" class="client"/>
  <text x="95" y="874" class="s">client side</text>
  <rect x="220" y="860" width="26" height="18" rx="4" class="server"/>
  <text x="255" y="874" class="s">server side (EC2)</text>
  <rect x="420" y="860" width="26" height="18" rx="4" fill="none" stroke="#7a4fbf" stroke-dasharray="4 3"/>
  <text x="455" y="874" class="s">client-part2 only</text>
  <line x1="610" y1="869" x2="660" y2="869" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="670" y="874" class="s">data flow</text>
  <line x1="780" y1="869" x2="830" y2="869" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="840" y="874" class="s">later data flow (main phase, after the run)</text>
  <line x1="60" y1="895" x2="110" y2="895" stroke="#e07b00" stroke-width="2.5" marker-end="url(#arrOrange)"/>
  <text x="120" y="900" class="s">server response → SwipeSender → SwipeRecord (status code + measured latency)</text>
  <text x="60" y="920" class="s">Thread count: 1 main + 1 generator + 32 warmup senders + N main-phase senders + 10 WebSocket subscriptions (Tyrus callbacks). The generator never blocks senders:</text>
  <text x="60" y="937" class="s">it only waits when the queue is full. Senders never write files; per-swipe records are written once by the main thread after every sender has finished.</text>
</svg>
